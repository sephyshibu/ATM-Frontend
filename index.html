<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2e5bff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ATM CRM</title>
    <!-- Dark appearance before the first paint; src/lib/theme.ts takes over from here. -->
    <script>
      try {
        var mode = localStorage.getItem("atm.theme")
        if (mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = "dark"
        }
      } catch (e) {}
    </script>
    <style>
      html.dark { background-color: #131315; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
